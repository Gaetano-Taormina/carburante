<body>
    <style>
        :root { --bg-page: #f8fafc; --bg-header: #ffffff; --text-primary: #1e293b; --border-color: #cbd5e1; }
        @media (prefers-color-scheme: dark) {
            :root { --bg-page: #0f172a; --bg-header: #1e293b; --text-primary: #f8fafc; --border-color: #475569; }
        }
        body { margin: 0; background-color: var(--bg-page); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .critical-header { background-color: var(--bg-header); border-bottom: 4px solid var(--border-color); padding: 12px 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .critical-container { max-width: 80rem; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .critical-title-group { display: flex; align-items: center; gap: 12px; }
        .critical-logo { width: 44px; height: 44px; border-radius: 12px; object-fit: contain; }
        .critical-h1 { margin: 0; font-size: 1.5rem; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 12px; }
        .critical-badge { display: inline-flex; background: rgba(241, 245, 249, 0.8); color: #334155; padding: 4px 14px; border-radius: 9999px; font-size: 0.8125rem; font-weight: 700; border: 1px solid rgba(203, 213, 225, 0.6); }
        @media (prefers-color-scheme: dark) {
            .critical-badge { background: rgba(30, 41, 59, 0.8); color: #e2e8f0; border-color: rgba(71, 85, 105, 0.6); }
        }
        .critical-skeleton-body { max-width: 80rem; margin: 20px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
        .critical-skeleton-box { height: 180px; border-radius: 16px; background: rgba(203, 213, 225, 0.3); animation: skeleton-pulse 1.5s ease-in-out infinite; }
        @media (prefers-color-scheme: dark) {
            .critical-skeleton-box { background: rgba(51, 65, 85, 0.3); }
        }
        @keyframes skeleton-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.3; } }
    </style>
    <div id="root">
        <header class="critical-header">
            <div class="critical-container">
                <div class="critical-title-group">
                    <h1 class="critical-h1">
                        <img class="critical-logo" src="/assets/img/icon-192.webp" alt="Logo" width="44" height="44" fetchpriority="high" loading="eager" />
                        <span class="tracking-tight drop-shadow-sm">FuelFinder</span>
                        <span class="critical-badge">Prezzi Ufficiali MIMIT</span>
                    </h1>
                </div>
            </div>
        </header>
        <main class="critical-skeleton-body" aria-hidden="true">
            <div class="critical-skeleton-box"></div>
        </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>
